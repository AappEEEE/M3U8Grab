name: M3U8Grab

options:
  bundleIdPrefix: com.m3u8grab
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: "NO"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: "s"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_MODULES: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  M3U8Grab:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m3u8grab.app
        PRODUCT_NAME: M3U8Grab
        INFOPLIST_FILE: Config/App-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    dependencies:
      - target: M3U8GrabSafari
        embed: true
        codeSign: true

  M3U8GrabSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/SafariExt/SafariWebExtensionHandler.swift
      # 不加 type: folder —— manifest.json / *.js 必须平铺在 appex 包根，
      # 否则 Safari 找不到 manifest。组方式会把每个文件当作资源拷到包根。
      - path: Sources/SafariExt/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m3u8grab.app.SafariExtension
        PRODUCT_NAME: M3U8GrabSafari
        INFOPLIST_FILE: Config/SafariExt-Info.plist
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  M3U8Grab:
    build:
      targets:
        M3U8Grab: all
    run:
      config: Debug
    archive:
      config: Release
