name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3u8grab-latest-release
  cancel-in-progress: false

jobs:
  build:
    name: Build M3U8Grab (unsigned)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew update >/dev/null 2>&1 || true
          brew install xcodegen
          xcodegen --version

      - name: Run HLS regression tests
        run: |
          swiftc Sources/App/HLSPlaylist.swift tools/HLSRegression.swift -o /tmp/hls-regression
          /tmp/hls-regression

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Validate extension resources
        run: |
          test -f Sources/SafariExt/Resources/manifest.json
          test -f Sources/SafariExt/Resources/background.js
          test -f Sources/SafariExt/Resources/content.js
          test -f Sources/SafariExt/Resources/popup.html
          test -f Sources/App/Resources/injected.js
          python3 -c "import json;json.load(open('Sources/SafariExt/Resources/manifest.json'));print('manifest ok')"

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project M3U8Grab.xcodeproj \
            -scheme M3U8Grab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/M3U8Grab.app"
          if [ ! -d "$APP" ]; then
            echo "app bundle not found, searching..."
            APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name "M3U8Grab.app" -type d | head -n 1)
          fi
          echo "app: $APP"
          ls -la "$APP"
          ls -la "$APP/PlugIns" || true

          export APP
          python3 - <<'PY'
          import json, os, pathlib, plistlib
          app = pathlib.Path(os.environ['APP'])
          extension = app / 'PlugIns/M3U8GrabSafari.appex'
          for bundle in (app, extension):
              with (bundle / 'Info.plist').open('rb') as file:
                  info = plistlib.load(file)
              assert info['CFBundleShortVersionString'] == '1.3.0', (bundle, info)
              assert str(info['CFBundleVersion']) == '4', (bundle, info)
          with (extension / 'manifest.json').open() as file:
              assert json.load(file)['version'] == '1.3.0'
          print('App + Safari extension: 1.3.0 (4); root manifest: 1.3.0')
          PY
          rm -rf Payload M3U8Grab.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/M3U8Grab.app
          zip -qry M3U8Grab.ipa Payload
          ls -lh M3U8Grab.ipa
          shasum -a 256 M3U8Grab.ipa | tee sha256.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: M3U8Grab-unsigned-ipa
          path: |
            M3U8Grab.ipa
            sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: latest
        run: |
          set -euo pipefail
          TITLE="M3U8 Grab v1.3.0 (build 4)"
          NOTES=$(cat <<EOF
          ## v1.3.0 · build 4
          - 全新 Liquid Glass 观感：地址栏、底部工具条、提示条改成悬浮玻璃质感，资源球加高光与描边。
          - 内置浏览器右下角「资源球」：发现资源后自动出现，可拖动、点开直接批量下载，位置会记住。
          - 新增书签小工具（bookmarklet）：不装扩展、在 LiveContainer 里也能在系统 Safari 抓地址，复制后回到 App 自动识别剪贴板。
          - 嗅探列表支持搜索与「全部 / M3U8 / 直链」筛选；新增 DASH（.mpd）与音频直链识别。
          - 直链（mp4/mp3/m4a 等）可直接下载，支持暂停、续传、速度与剩余时间。
          - 详情页可一键复制带 Referer / UA 的 curl 命令，方便交给电脑端工具。
          - 嗅探扩展同步扩容：m3u、mpd、mp3、m4a、aac、ogg、wav、opus 等。

          此 IPA 未签名。Sideloadly/AltStore/SideStore 等安装工具需要个人 Apple ID 或签名证书；TrollStore 按其适用系统和安装流程操作。
          稳定下载资产：M3U8Grab.ipa；校验文件：sha256.txt。
          构建提交：${GITHUB_SHA}
          构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" -f sha="$GITHUB_SHA" -F force=true || \
            gh api --method POST "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --verify-tag --title "$TITLE" --notes "$NOTES" --latest
          fi
          gh release upload "$TAG" M3U8Grab.ipa sha256.txt --clobber

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7
