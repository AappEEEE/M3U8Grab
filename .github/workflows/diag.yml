name: Runner probe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  linux:
    name: linux probe
    runs-on: ubuntu-latest
    steps:
      - run: uname -a
      - run: echo "linux runner ok"

  mac:
    name: mac probe
    runs-on: macos-13
    steps:
      - run: sw_vers
      - run: xcodebuild -version
